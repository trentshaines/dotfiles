[terminal]
mode = "inplace"

[cleanup]
default_mode = "interactive"

[scripts.custom.linear]
description = "Create a worktree from Linear ticket ID or URL"
# Matches any prefix like TECH-123, BEAN-456, ABC-789, etc.
branch_name = "echo $1 | grep -oiE '[A-Z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' | xargs linearis issues read | jq -r '.branchName // empty' | sed 's|^[^/]*/||'"

[scripts.custom.sentry]
description = "Create a worktree from Sentry issue ID"
# Creates branch like fix/sentry-PYTHON-FASTAPI-123
branch_name = "echo \"fix/sentry-$1\""
