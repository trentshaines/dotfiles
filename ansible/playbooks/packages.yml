- name: Install Homebrew packages on macOS
  hosts: localhost
  become: no
  tasks:
    - name: Check if Homebrew is installed
      command: brew --version
      register: brew_check
      ignore_errors: yes

    - name: Install Homebrew
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: brew_check.rc != 0

    - name: Add brew taps
      homebrew_tap:
        name:
          - joshmedeski/sesh
          - felixkratz/formulae
          - kyu08/tap
          - nikitabobko/tap
          - getsentry/tools
        state: present

    - name: Install brew formulae
      homebrew:
        name:
          # Editor and development
          - neovim
          - tmux
          - git
          - gh
          - lazygit

          # Shell
          - fish
          - starship

          # Search and navigation
          - fzf
          - fd
          - ripgrep
          - zoxide
          - bat
          - eza

          # Python
          - python@3.13
          - poetry
          - pyenv
          - pyenv-virtualenv
          - pipx

          # Node
          - node
          - nvm

          # Database tools
          - postgresql@17
          - pgcli

          # Utilities
          - chezmoi
          - htop
          - btop
          - tree-sitter
          - sesh
          - tmuxinator
          - borders
          - fzf-bookmark-opener
          - jq
          - tree
          - coreutils
          - xh

          # Security
          - gnupg
          - pass
          - pass-otp
          - pinentry-mac

          # Beandex server infrastructure
          - cloudflared
          - crane
          - sentry-cli

        state: present

    - name: Install brew casks
      homebrew_cask:
        name:
          - raycast
          - obsidian
          - alacritty
          - font-hack-nerd-font
          - docker
          - tailscale
        state: present
      ignore_errors: yes

    # These casks require manual install (they prompt for sudo/accessibility):
    # brew install --cask nikitabobko/tap/aerospace karabiner-elements espanso
    # After installing obsidian cask: enable CLI in Settings > General > Advanced > Command line interface

    - name: Install Oh My Zsh
      shell: |
        if [ ! -d "$HOME/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
        fi
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"

    - name: Add fish to /etc/shells
      become: yes
      lineinfile:
        path: /etc/shells
        line: /opt/homebrew/bin/fish
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Set fish as default shell
      become: yes
      user:
        name: "{{ ansible_facts['env']['USER'] }}"
        shell: /opt/homebrew/bin/fish
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install Fisher (fish plugin manager)
      shell: |
        /opt/homebrew/bin/fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.config/fish/functions/fisher.fish"

    - name: Install TPM (Tmux Plugin Manager)
      git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"
        update: no

    - name: Install Claude Code via native installer
      shell: |
        curl -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/install.sh | sh
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"

    - name: Ensure pipx is ensured (creates ~/.local/bin)
      command: pipx ensurepath
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/pipx"

    - name: Install autowt via pipx
      command: pipx install autowt
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/autowt"

    - name: Install python-lsp-server via pipx
      command: pipx install python-lsp-server
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/pylsp"

    - name: Install global npm packages
      npm:
        name: "{{ item }}"
        global: yes
        state: present
      loop:
        - pyright
        - typescript-language-server
        - typescript
        - tree-sitter-cli
