- name: Install Homebrew packages on macOS
  hosts: localhost
  become: no
  tasks:
    - name: Check if Homebrew is installed
      command: brew --version
      register: brew_check
      ignore_errors: yes

    - name: Install Homebrew
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: brew_check.rc != 0

    - name: Add brew taps
      homebrew_tap:
        name:
          - joshmedeski/sesh
          - felixkratz/formulae
          - kyu08/tap
        state: present

    - name: Install brew formulae
      homebrew:
        name:
          # Editor and development
          - neovim
          - tmux
          - git
          - gh
          - lazygit

          # Search and navigation
          - fzf
          - ripgrep
          - zoxide
          - bat
          - eza

          # Python
          - python@3.13
          - poetry

          # Node
          - node
          - nvm

          # Database tools
          - postgresql@17
          - pgcli

          # Utilities
          - chezmoi
          - htop
          - tree-sitter
          - sesh
          - tmuxinator
          - borders
          - fzf-bookmark-opener

          # Security
          - gnupg
          - pass
          - pass-otp
          - pinentry-mac

        state: present

    - name: Install brew casks
      homebrew_cask:
        name:
          - aerospace
        state: present
