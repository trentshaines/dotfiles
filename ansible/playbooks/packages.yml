- name: Install Homebrew packages on macOS
  hosts: localhost
  become: no
  tasks:
    - name: Check if Homebrew is installed
      command: brew --version
      register: brew_check
      ignore_errors: yes

    - name: Install Homebrew
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: brew_check.rc != 0

    - name: Add brew taps
      homebrew_tap:
        name:
          - joshmedeski/sesh
          - felixkratz/formulae
          - kyu08/tap
          - nikitabobko/tap
        state: present

    - name: Install brew formulae
      homebrew:
        name:
          # Editor and development
          - neovim
          - tmux
          - git
          - gh
          - lazygit

          # Shell
          - fish
          - starship

          # Search and navigation
          - fzf
          - fd
          - ripgrep
          - zoxide
          - bat
          - eza

          # Python
          - python@3.13
          - poetry
          - pyenv
          - pyenv-virtualenv

          # Node
          - node
          - nvm

          # Database tools
          - postgresql@17
          - pgcli

          # Utilities
          - chezmoi
          - htop
          - btop
          - tree-sitter
          - sesh
          - tmuxinator
          - borders
          - fzf-bookmark-opener
          - jq
          - tree
          - coreutils
          - xh

          # Security
          - gnupg
          - pass
          - pass-otp
          - pinentry-mac

        state: present

    - name: Install brew casks
      homebrew_cask:
        name:
          - nikitabobko/tap/aerospace
          - raycast
          - obsidian
          - alacritty
          - karabiner-elements
          - espanso
          - font-hack-nerd-font
        state: present

    - name: Install Oh My Zsh
      shell: |
        if [ ! -d "$HOME/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
        fi
      args:
        creates: "{{ ansible_env.HOME }}/.oh-my-zsh"

    - name: Add fish to /etc/shells
      become: yes
      lineinfile:
        path: /etc/shells
        line: /opt/homebrew/bin/fish
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Set fish as default shell
      become: yes
      user:
        name: "{{ ansible_env.USER }}"
        shell: /opt/homebrew/bin/fish
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install Fisher (fish plugin manager)
      shell: |
        /opt/homebrew/bin/fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
      args:
        creates: "{{ ansible_env.HOME }}/.config/fish/functions/fisher.fish"

    - name: Install TPM (Tmux Plugin Manager)
      git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ ansible_env.HOME }}/.tmux/plugins/tpm"
        update: no

    - name: Install Claude Code globally via npm
      npm:
        name: "@anthropic-ai/claude-code"
        global: yes
        state: present
