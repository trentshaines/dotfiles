# Default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Prefix key.
set-option -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind | split-window -h
bind - split-window -v
# More intuitive split bindings
bind v split-window -h
bind s split-window -v
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Swap current pane with marked pane (mark with prefix+m first)
bind m select-pane -m  # mark current pane
bind M swap-pane      # swap with marked pane

# Navigate panes with prefix + hjkl (fallback when vim-tmux-navigator isn't working)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes using prefix + Shift+HJKL
bind H swap-pane -U   # swap left/up in order
bind L swap-pane -D   # swap right/down in order
bind J run-shell 'tmux select-pane -D && tmux swap-pane -U'
bind K run-shell 'tmux select-pane -U && tmux swap-pane -D'
set -g mouse on
set-option -g allow-rename off

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
bind r source-file ~/.tmux.conf
set-option -g history-limit 10000

# Resize panes (border-centric: moving the borders) - repeatable
bind -r Up resize-pane -U 2     # Up = move border up (shorter)
bind -r Down resize-pane -D 2   # Down = move border down (taller)
bind -r Right resize-pane -R 2  # Right = move border right (wider)
bind -r Left resize-pane -L 2   # Left = move border left (narrower)

# Large resize with prefix + Shift + arrows - repeatable
bind -r S-Up resize-pane -U 10     # Shift+Up = move border up (much shorter)
bind -r S-Down resize-pane -D 10   # Shift+Down = move border down (much taller)
bind -r S-Right resize-pane -R 10  # Shift+Right = move border right (much wider)
bind -r S-Left resize-pane -L 10   # Shift+Left = move border left (much narrower)

# panes
set -g pane-border-style 'fg=color233'
set -g pane-active-border-style 'fg=color255'

# status bar
set -g status-position bottom
set -g status-style 'bg=color233 fg=color15 dim'

# Fix the slow escape-time for vim
set -sg escape-time 0

# Fix colors for Neovim/LazyVim
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Update terminal title with session name
set -g set-titles on
set -g set-titles-string "#S"



# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-yank settings
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# tmux-resurrect settings
set -g @resurrect-processes 'nvim claude ssh'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Vi mode for copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
bind P paste-buffer

# session fzf
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Quick switch to last session with prefix+Tab
bind-key "Tab" run-shell "sesh last || tmux display-message -d 1000 \"Only one session\""

# Create new window with 3-pane main-horizontal layout (prefix + N)
bind-key N run-shell "fish -ic 'tnw'"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
