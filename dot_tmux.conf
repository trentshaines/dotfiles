# Default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Prefix key.
set-option -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# More intuitive split bindings
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Swap current pane with marked pane (mark with prefix+m first)
bind m select-pane -m  # mark current pane
bind M swap-pane      # swap with marked pane

# Navigate panes with prefix + hjkl (fallback when vim-tmux-navigator isn't working)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes using prefix + Shift+HJKL
bind H swap-pane -U   # swap left/up in order
bind L swap-pane -D   # swap right/down in order
bind J run-shell 'tmux select-pane -D && tmux swap-pane -U'
bind K run-shell 'tmux select-pane -U && tmux swap-pane -D'

# Select pane N using prefix + 1-9 (override default window switching)
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4
bind 5 select-pane -t 5
bind 6 select-pane -t 6
bind 7 select-pane -t 7
bind 8 select-pane -t 8
bind 9 select-pane -t 9

# Select window N using prefix + Shift+1-9
bind '!' select-window -t :1
bind '@' select-window -t :2
bind '#' select-window -t :3
bind '$' select-window -t :4
bind '%' select-window -t :5
bind '^' select-window -t :6
bind '&' select-window -t :7
bind '*' select-window -t :8
bind '(' select-window -t :9

# Restore overwritten bindings with new keys
bind X display-menu -T "⚠ KILL WINDOW [#W] ⚠" "Yes, kill window" y kill-window "No, cancel" n ""
bind x display-menu -T "Close pane #{pane_index}" "Yes" y kill-pane "No" n ""
bind O display-menu -T "Kill other panes?" "Yes" y "kill-pane -a" "No" n ""
bind _ split-window -h -c "#{pane_current_path}"              # was %
bind B break-pane                                              # was !
set -g mouse on
set-option -g allow-rename off
set-option -g automatic-rename off

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
bind r source-file ~/.tmux.conf
set-option -g history-limit 10000

# Resize panes (border-centric: moving the borders) - repeatable
bind -r Up resize-pane -U 2     # Up = move border up (shorter)
bind -r Down resize-pane -D 2   # Down = move border down (taller)
bind -r Right resize-pane -R 2  # Right = move border right (wider)
bind -r Left resize-pane -L 2   # Left = move border left (narrower)

# Large resize with prefix + Shift + arrows - repeatable
bind -r S-Up resize-pane -U 10     # Shift+Up = move border up (much shorter)
bind -r S-Down resize-pane -D 10   # Shift+Down = move border down (much taller)
bind -r S-Right resize-pane -R 10  # Shift+Right = move border right (much wider)
bind -r S-Left resize-pane -L 10   # Shift+Left = move border left (much narrower)

# Color configuration
# Status bar highlight color: #fff2cc (light yellow)
# Status bar prefix pressed color: #ff10f0 (magenta)
# Status bar background: #1a1b26 (tokyonight background)

# panes
set -g pane-border-style 'fg=#1a1b26'
set -g pane-active-border-style 'fg=color255'
set -g pane-border-status top
set -g pane-border-format "#{?#{!=:#{pane_title},},#{?pane_active,#[fg=#fff2cc]#[fg=#000000 bg=#fff2cc] #{=40:pane_title} #[fg=#fff2cc bg=default],#[fg=#1a1b26]#[fg=#a9b1d6 bg=#1a1b26] #{=40:pane_title} #[fg=#1a1b26 bg=default]},}#[align=right]#{?pane_active,#[fg=#fff2cc]#[fg=#000000 bg=#fff2cc] #{pane_index} #[fg=#fff2cc bg=default]══,#[fg=#1a1b26]#[fg=#a9b1d6 bg=#1a1b26] #{pane_index} #[fg=#1a1b26 bg=default]══}#[default]"
set -g pane-border-lines double

# status bar
set -g status-position bottom

# Fix the slow escape-time for vim
set -sg escape-time 0

# Fix colors for Neovim/LazyVim
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Update terminal title with session name
set -g set-titles on
set -g set-titles-string "#S"



# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @plugin 'niksingh710/minimal-tmux-status'

# minimal-tmux-status settings
set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#fff2cc"
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator-str "  tmux  "
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"

# tmux-yank settings
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# tmux-resurrect settings
set -g @resurrect-processes 'nvim ssh'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Vi mode for copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
# OSC 52 for clipboard over SSH (works with iTerm2, ShellFish, etc.)
set -g set-clipboard on
set -g allow-passthrough on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/bin/osc52-copy > #{pane_tty}'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '~/bin/osc52-copy > #{pane_tty}'
bind P paste-buffer

# Scroll by 5 lines in copy mode (complement to Ctrl+e/y for 1 line)
# Using D (down) and U (up) for 5-line scrolls
bind-key -T copy-mode-vi D send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi U send-keys -X -N 5 scroll-up

# session fzf (uses bash directly in popup for speed)
bind-key "t" display-popup -E -w 80% -h 70% "/bin/bash -c 'sesh connect \"\$(sesh list --icons | fzf \
    --no-sort --ansi --border-label \" sesh \" --prompt \"⚡  \" \
    --header \"  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find\" \
    --bind \"tab:down,btab:up\" \
    --bind \"ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)\" \
    --bind \"ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)\" \
    --bind \"ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)\" \
    --bind \"ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)\" \
    --bind \"ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)\" \
    --bind \"ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)\" \
    --preview-window \"right:55%\" \
    --preview \"sesh preview {}\")\"'"

# Window fzf picker (current session only)
bind-key "w" display-popup -E -w 60% -h 50% "/bin/bash -c 'tmux list-windows -F \"#{window_index}: #{window_name}#{?window_active, (active),}\" | fzf \
    --no-sort --border-label \" windows \" --prompt \"🪟  \" \
    --header \"  Select window\" \
    --preview \"tmux capture-pane -t :{} -p 2>/dev/null | head -30\" \
    --preview-window \"right:50%\" \
    | cut -d: -f1 | xargs -I{} tmux select-window -t :{}'"
# Built-in window/session tree (prefix + W)
bind-key "W" choose-tree -Zw

# Quick switch to last session with prefix+Tab
bind-key "Tab" run-shell "sesh last || tmux display-message -d 1000 \"Only one session\""

# Quick switch to last window with prefix+a
# Quick toggle bindings
bind '`' last-pane
bind '~' last-window
bind '+' select-window -t '{end}'
bind a show-messages

# New window at session root (not home)
bind c new-window -c "#{session_path}"

# Create new window with 3-pane main-horizontal layout (prefix + N)
bind-key N run-shell "fish -ic 'tnw'"

# Claude notifications picker (prefix + e) - uses bash directly for speed
bind-key e run-shell "$HOME/.claude/scripts/claude-popup.sh"

# All panes picker (prefix + E)
bind-key E display-popup -E -w 95% -h 60% -b rounded -S "fg=#ffffff" -e "TMUX_CLIENT_WIDTH=#{client_width}" -e "TMUX_CLIENT_HEIGHT=#{client_height}" "/bin/bash $HOME/.config/tmux/pane-pick.sh"

# Auto-clear notifications when focusing a pane
set-hook -g after-select-pane 'run-shell "$HOME/.claude/scripts/claude-pane-focus.sh"'

# Auto-rename windows to git branch name (but not for main/master)
# Shows [wt] for worktrees
set-hook -g after-new-window 'run-shell "cd #{pane_current_path}; branch=\$(git rev-parse --abbrev-ref HEAD 2>/dev/null); if [ -n \"\$branch\" ] && [ \"\$branch\" != \"main\" ] && [ \"\$branch\" != \"master\" ]; then git rev-parse --git-common-dir 2>/dev/null | grep -q worktrees && wt=\"[wt]\" || wt=\"\"; tmux rename-window \"\$branch\$wt\"; fi"'

set-hook -g after-split-window 'run-shell "cd #{pane_current_path}; branch=\$(git rev-parse --abbrev-ref HEAD 2>/dev/null); if [ -n \"\$branch\" ] && [ \"\$branch\" != \"main\" ] && [ \"\$branch\" != \"master\" ]; then git rev-parse --git-common-dir 2>/dev/null | grep -q worktrees && wt=\"[wt]\" || wt=\"\"; tmux rename-window \"\$branch\$wt\"; fi"'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override plugin's default background to match tokyonight
set -g status-style bg=#1a1b26
set -g status-justify centre
# Override the window status format to use tokyonight bg instead of default (fixes black corners)
set -g window-status-current-format "#[fg=#fff2cc,bg=#1a1b26]#[bg=#fff2cc,fg=#000000] #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep \"^ssh \" | sed \"s/.* //\"),#W} #{?window_zoomed_flag,󰊓 ,}#[fg=#fff2cc,bg=#1a1b26]"
# Override status-left to show session name (add RIGHT-ARROW after the #[fg=#fff2cc,bg=#1a1b26] at the end)
set -g status-left-length 50
set -g status-left "#[fg=#fff2cc,bg=#1a1b26]#[bg=#fff2cc,fg=#000000,bold] #{=45:session_name} #[fg=#fff2cc,bg=#1a1b26]"
# Override status-right to show tmux indicator (changes color on prefix press - blue normally, orange when pressed)
set -g status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#{?client_prefix,#ff10f0,#fff2cc},fg=#000000,bold]  tmux  "

# Click "tmux" in status bar for quick actions menu (phone-friendly)
bind -n MouseUp1StatusRight display-menu -T "#[align=centre]Quick Actions" -x R -y S \
  "󰗼 Detach"           d "detach" \
  " Kill Pane"        x "kill-pane" \
  "" \
  "󰊓 New Window"       w "new-window -c '#{pane_current_path}'" \
  "󰤼 Split Horizontal" s "split-window -v -c '#{pane_current_path}'" \
  "󰤻 Split Vertical"   v "split-window -h -c '#{pane_current_path}'" \
  "" \
  " Panes"             E "display-popup -E -w 95% -h 90% \"/bin/bash $HOME/.config/tmux/pane-pick.sh\"" \
  "󰖯 Windows"          W "choose-tree -Zw" \
  " Sessions"         t "display-popup -E -w 80% -h 70% \"/bin/bash -c 'sesh connect \\\"\\$(sesh list --icons | fzf --no-sort --ansi)\\\"'\"" \
  "󰁯 Last Session"     Tab "run-shell 'sesh last'" \
  "󰁯 Last Window"      L "last-window"

# Click session name (left) for window picker
bind -n MouseUp1StatusLeft choose-tree -Zw
