# Explicit names survive branch hooks, assistant hooks and resurrect.
bind-key , command-prompt -I '#W' -p 'Window name (pinned)' { set-option -w @manual-window-name '%%' ; set-option -w automatic-rename off ; set-option -w allow-rename off ; rename-window '%%' }
bind-key M-, set-option -wu @manual-window-name \; set-option -wu @auto-branch \; set-option -wu @auto-claude \; set-option -w automatic-rename on \; display-message 'Window name unpinned'
set-hook -g after-rename-window[90] 'run-shell "python3 $HOME/.config/tmux/window-names.py enforce #{window_id}"'
set-hook -g after-new-window[0] 'run-shell "python3 $HOME/.config/tmux/window-names.py branch #{pane_id}"'
set-hook -g after-split-window[0] 'run-shell "python3 $HOME/.config/tmux/window-names.py branch #{pane_id}"'
