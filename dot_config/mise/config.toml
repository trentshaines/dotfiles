# Global mise tool configuration
# Managed by chezmoi — ~/.config/mise/config.toml
# All versions pinned for reproducibility

[settings]
# Worktrees here are local checkouts of the trusted Theseus repository.
trusted_config_paths = ["~/git/theseus-worktrees"]

[tools]
# Languages
node = "22"
python = "3.13"

# Package managers
uv = "latest"
poetry = "latest"

# Editor
neovim = "0.12"

# CLI tools
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
jq = "latest"
lazygit = "latest"
starship = "latest"
zoxide = "latest"
gh = "latest"
xh = "latest"
yq = "latest"
awscli = "latest"
