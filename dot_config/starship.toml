"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
[ ](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[ ](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
[ ](fg:#212736 bg:#33658A)\
$cmd_duration\
[ ](fg:#33658A bg:#1d2230)\
$time\
[](fg:#1d2230)\
$character """

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[ ($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "bg:#33658A"
format = '[[ 󱦟 $duration ](fg:#e3e5e5 bg:#33658A)]($style)'

[character]
format = '$symbol'
success_symbol = '[ ](fg:#1d2230 bg:#ffffd7)[  INSERT  ](fg:#000000 bg:#ffffd7)[](fg:#ffffd7)'
vimcmd_symbol = '[ ](fg:#1d2230 bg:#d7d7ff)[  NORMAL  ](fg:#000000 bg:#d7d7ff)[](fg:#d7d7ff)'
